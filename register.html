<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Crear Cuenta - Álbum Mundial 2026</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#111827">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" href="./assets/images/icon.png">
    <link rel="apple-touch-icon" href="./assets/images/icon.png">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/register.css">
</head>
<body>

<div class="register-wrapper">

    <a href="index.html" class="back-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <path d="M15 18l-6-6 6-6"/>
        </svg>
        Volver al inicio
    </a>

    <div class="logo-wrap">
        <img src="./assets/images/logo26.png?v=4" class="auth-logo" alt="Álbum Mundial 2026">
        <h1>Álbum 26</h1>
        <p class="subtitle">Crear Cuenta</p>
    </div>

    <div class="register-card">
        <h2 class="card-title">Crear Cuenta Familiar</h2>
        <p class="card-desc">Crea una cuenta para sincronizar el álbum en todos los dispositivos de la familia en tiempo real.</p>

        <div class="tip-box">
            Usa el mismo correo en todos los teléfonos de la familia para compartir el álbum automáticamente.
        </div>

        <form id="register-form" onsubmit="event.preventDefault(); doRegister();">
            <div class="input-group">
                <label class="input-label" for="reg-email">Correo Electrónico</label>
                <input type="email" id="reg-email" class="auth-input" placeholder="familia@ejemplo.com" required autocomplete="email">
            </div>
            <div class="input-group">
                <label class="input-label" for="reg-pass">Contraseña</label>
                <input type="password" id="reg-pass" class="auth-input" placeholder="Mínimo 6 caracteres" required autocomplete="new-password" minlength="6">
            </div>
            <div class="input-group">
                <label class="input-label" for="reg-pass2">Confirmar Contraseña</label>
                <input type="password" id="reg-pass2" class="auth-input" placeholder="Repite la contraseña" required autocomplete="new-password" minlength="6">
            </div>

            <button type="submit" class="btn-primary" id="btn-register">
                Crear Mi Cuenta
            </button>
            <div id="status-msg"></div>
        </form>

        <div class="divider">o si ya tienes cuenta</div>

        <button class="btn-secondary" onclick="window.location.href='index.html'">
            Entrar al Álbum
        </button>
    </div>

</div>

<!-- FIREBASE -->
<script type="module" src="./js/register.js"></script>

</body>
</html>
